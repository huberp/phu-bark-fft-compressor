name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    uses: ./.github/workflows/build-windows-vst3.yml
    with:
      arch: x64
      run-pluginval: true

  build-linux:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: Install Dependencies
      run: sudo bash scripts/install-linux-deps.sh
    - name: Configure CMake
      run: cmake --preset linux-x64-vst3-release
    - name: Build
      run: cmake --build --preset linux-x64-vst3-release-build

  build-macos-arm64-vst3:
    uses: ./.github/workflows/build-macos.yml
    with:
      arch: arm64
      format: VST3
      run-pluginval: true

  build-macos-arm64-au:
    uses: ./.github/workflows/build-macos.yml
    with:
      arch: arm64
      format: AU
      run-pluginval: false

  build-macos-x64-vst3:
    uses: ./.github/workflows/build-macos.yml
    with:
      arch: x64
      format: VST3
      run-pluginval: true

  build-macos-x64-au:
    uses: ./.github/workflows/build-macos.yml
    with:
      arch: x64
      format: AU
      run-pluginval: false
