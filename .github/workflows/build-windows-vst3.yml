name: Build Windows VST3 (reusable)

# Reusable workflow called by build.yml and release.yml.
# Handles: Intel MKL install via NuGet (x64 only), CMake configure+build,
# optional pluginval validation, optional packaging, optional artifact upload.

on:
  workflow_call:
    inputs:
      arch:
        description: 'CMake target architecture — x64 or ARM64'
        type: string
        default: 'x64'
      run-pluginval:
        description: 'Run pluginval validation after build'
        type: boolean
        default: true
      upload-artifact:
        description: 'Upload the packaged VST3 as a workflow artifact'
        type: boolean
        default: false
      artifact-name:
        description: 'Name of the uploaded artifact (used when upload-artifact is true)'
        type: string
        default: 'windows-vst3'
      ref-name:
        description: >
          Git ref name (e.g. the tag) used for package file naming.
          When empty the packaging step is skipped.
        type: string
        default: ''
    outputs:
      validation-status:
        description: 'pluginval result: passed | failed | no_plugin | no_pluginval | skipped'
        value: ${{ jobs.build.outputs.validation-status }}

jobs:
  build:
    runs-on: windows-latest

    outputs:
      validation-status: ${{ steps.validate.outputs.validation_status }}

    env:
      # Pin the Intel MKL NuGet version for reproducible, cacheable installs.
      # Update this value to pick up a newer MKL release.
      # Intel MKL has no ARM64 binaries; MKL is only installed when arch == x64.
      MKL_NUGET_VERSION: '2020.4.304'
      BUILD_DIR: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # -----------------------------------------------------------------------
      # Intel MKL — x64 only (Intel MKL has no ARM64 binaries)
      # -----------------------------------------------------------------------
      - name: Cache Intel MKL NuGet package
        if: ${{ inputs.arch == 'x64' }}
        id: cache-mkl
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\mkl_pkg
          key: intel-mkl-nuget-${{ env.MKL_NUGET_VERSION }}-win-x64

      - name: Install Intel MKL via NuGet
        if: ${{ inputs.arch == 'x64' && steps.cache-mkl.outputs.cache-hit != 'true' }}
        shell: pwsh
        run: |
          nuget install intelmkl.redist.win-x64 `
            -Version $env:MKL_NUGET_VERSION `
            -OutputDirectory "$env:RUNNER_TEMP\mkl_pkg"

      - name: Set MKLROOT (x64)
        if: ${{ inputs.arch == 'x64' }}
        shell: pwsh
        run: |
          $mklRoot = "$env:RUNNER_TEMP\mkl_pkg\intelmkl.redist.win-x64.$env:MKL_NUGET_VERSION\runtimes\win-x64\native"
          if (Test-Path $mklRoot) {
            echo "MKLROOT=$mklRoot" >> $env:GITHUB_ENV
            Write-Host "MKLROOT set to: $mklRoot"
          } else {
            Write-Warning "MKL native path not found at $mklRoot — MKL will be skipped"
          }

      # -----------------------------------------------------------------------
      # Build
      # -----------------------------------------------------------------------
      - name: Configure CMake
        shell: pwsh
        run: |
          # ARM64: Intel MKL ships no ARM64 binaries, so explicitly disable it.
          # x64:   MKLROOT is set by the preceding "Set MKLROOT" step when MKL
          #        is available; CMakeLists.txt falls back gracefully if not set.
          $mklFlag = if ("${{ inputs.arch }}" -eq "ARM64") { "-DUSE_INTEL_MKL=OFF" } else { "" }
          cmake -B $env:BUILD_DIR -DCMAKE_BUILD_TYPE=Release -A ${{ inputs.arch }} $mklFlag

      - name: Build
        run: cmake --build ${{ env.BUILD_DIR }} --config Release

      # -----------------------------------------------------------------------
      # Validation (optional)
      # -----------------------------------------------------------------------
      - name: Download pluginval
        if: ${{ inputs.run-pluginval }}
        shell: pwsh
        run: |
          Write-Host "Downloading pluginval..."
          Invoke-WebRequest `
            -Uri "https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip" `
            -OutFile "pluginval.zip"
          Write-Host "Extracting pluginval..."
          Expand-Archive -Path "pluginval.zip" -DestinationPath "pluginval" -Force

      - name: Validate VST3 Plugin
        if: ${{ inputs.run-pluginval }}
        id: validate
        shell: bash
        run: |
          set +e

          VST3_PATH=$(find $BUILD_DIR/src/phu-bark-fft-compressor_artefacts/Release/VST3 \
            -name "*.vst3" -type d | head -n 1)

          if [ -z "$VST3_PATH" ]; then
            echo "ERROR: VST3 plugin not found!"
            echo "validation_status=no_plugin" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Found VST3 plugin at: $VST3_PATH"

          if [ ! -f "./pluginval/pluginval.exe" ]; then
            echo "ERROR: pluginval.exe not found"
            echo "validation_status=no_pluginval" >> $GITHUB_OUTPUT
            exit 0
          fi

          mkdir -p ./validation-results

          ./pluginval/pluginval.exe \
            --strictness-level 5 \
            --validate-in-process \
            --output-dir ./validation-results \
            --validate "$VST3_PATH" 2>&1 | \
            tee ./validation-results/console-output.txt

          if [ ${PIPESTATUS[0]} -eq 0 ]; then
            echo "validation_status=passed" >> $GITHUB_OUTPUT
          else
            echo "validation_status=failed" >> $GITHUB_OUTPUT
          fi

          exit 0

      - name: Upload Validation Results
        uses: actions/upload-artifact@v4
        if: ${{ always() && inputs.run-pluginval }}
        with:
          name: validation-results-${{ inputs.arch }}
          path: ./validation-results/

      - name: Add Validation Summary
        if: ${{ always() && inputs.run-pluginval }}
        shell: bash
        run: |
          STATUS="${{ steps.validate.outputs.validation_status }}"
          ARCH="${{ inputs.arch }}"

          echo "## VST3 Plugin Validation Results (${ARCH})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          case "$STATUS" in
            passed)      echo "### ✅ Validation Passed" ;;
            failed)      echo "### ❌ Validation Failed" ;;
            no_plugin)   echo "### ⚠️ VST3 Plugin Not Found" ;;
            no_pluginval) echo "### ⚠️ Pluginval Not Found" ;;
            *)           echo "### ⚠️ No Results" ;;
          esac >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f "./validation-results/console-output.txt" ]; then
            echo "#### Validation Report (first 50 lines):" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            head -n 50 ./validation-results/console-output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📦 Full validation results available in artifacts." >> $GITHUB_STEP_SUMMARY

      - name: Fail Build on Validation Failure
        if: ${{ always() && inputs.run-pluginval }}
        shell: bash
        run: |
          STATUS="${{ steps.validate.outputs.validation_status }}"
          case "$STATUS" in
            failed|no_plugin|no_pluginval)
              echo "Build failed: plugin validation status = $STATUS"
              exit 1
              ;;
          esac
          echo "Validation passed successfully"

      # -----------------------------------------------------------------------
      # Package (only when a ref-name is provided, i.e. release builds)
      # -----------------------------------------------------------------------
      - name: Package VST3
        if: ${{ inputs.ref-name != '' }}
        shell: pwsh
        run: |
          $version = "${{ inputs.ref-name }}" -replace '^v', ''
          $arch    = "${{ inputs.arch }}".ToLower()
          $zipName = "PHU-BARK-FFT-COMPRESSOR-windows-${arch}-${version}.zip"

          New-Item -ItemType Directory -Force -Path dist    | Out-Null
          New-Item -ItemType Directory -Force -Path staging | Out-Null

          $vst3 = Get-ChildItem -Recurse `
            -Path $env:BUILD_DIR `
            -Filter "*.vst3" -Directory | Select-Object -First 1

          Copy-Item -Path $vst3.FullName -Destination "staging" -Recurse
          Compress-Archive -Path "staging\*" -DestinationPath "dist\$zipName" -Force
          Write-Host "Created dist\$zipName"

      - name: Upload VST3 Artifact
        if: ${{ inputs.upload-artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: dist/*.zip
