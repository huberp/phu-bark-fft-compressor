on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Build & package Windows x64 VST3
  # ---------------------------------------------------------------------------
  release-windows-x64:
    name: Windows x64 VST3
    uses: ./.github/workflows/build-windows-vst3.yml
    with:
      arch: x64
      run-pluginval: true
      upload-artifact: true
      artifact-name: windows-x64-vst3
      ref-name: ${{ github.ref_name }}

  # ---------------------------------------------------------------------------
  # Build & package Windows ARM64 VST3 (cross-compiled on x64 runner)
  # ---------------------------------------------------------------------------
  release-windows-arm64:
    name: Windows ARM64 VST3
    uses: ./.github/workflows/build-windows-vst3.yml
    with:
      arch: ARM64
      run-pluginval: false
      upload-artifact: true
      artifact-name: windows-arm64-vst3
      ref-name: ${{ github.ref_name }}

  # ---------------------------------------------------------------------------
  # Build & package Linux VST3
  # ---------------------------------------------------------------------------
  release-linux-x64:
    name: Linux x64 VST3
    uses: ./.github/workflows/build-linux.yml
    with:
      arch: x64
      run-pluginval: true
      upload-artifact: true
      artifact-name: linux-x64-vst3
      ref-name: ${{ github.ref_name }}

  # ---------------------------------------------------------------------------
  # Generate README.pdf
  # ---------------------------------------------------------------------------
  generate-pdf:
    name: Generate README.pdf
    uses: ./.github/workflows/generate-pdf.yml
    with:
      in-md: README.md

  # ---------------------------------------------------------------------------
  # Inject README.pdf into all zips, publish GitHub Release
  # ---------------------------------------------------------------------------
  publish-release:
    name: Publish GitHub Release
    needs: [release-windows-x64, release-windows-arm64, release-linux-x64, generate-pdf]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Windows x64 artifact
        uses: actions/download-artifact@v8
        with:
          name: windows-x64-vst3
          path: dist/

      - name: Download Windows ARM64 artifact
        uses: actions/download-artifact@v8
        with:
          name: windows-arm64-vst3
          path: dist/

      - name: Download Linux x64 artifact
        uses: actions/download-artifact@v8
        with:
          name: linux-x64-vst3
          path: dist/

      - name: Download README.pdf artifact
        uses: actions/download-artifact@v8
        with:
          name: pdf
          path: .

      - name: Inject README.pdf into all release zips
        run: |
          for zip in dist/*.zip; do
            zip -j "$zip" README.pdf
            echo "Injected README.pdf into $zip"
          done

      - name: List release assets
        run: ls -lh dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: phu-bark-fft-compressor ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ## phu-bark-fft-compressor ${{ github.ref_name }}

            ### Installation

            **Windows x64** — download `PHU-BARK-FFT-COMPRESSOR-windows-x64-*.zip`, extract and copy
            `PHU BARK FFT COMPRESSOR.vst3` to `C:\Program Files\Common Files\VST3\`.

            **Windows ARM64** — download `PHU-BARK-FFT-COMPRESSOR-windows-arm64-*.zip`, extract and copy
            `PHU BARK FFT COMPRESSOR.vst3` to `C:\Program Files\Common Files\VST3\`.

            **Linux x64** — download `PHU-BARK-FFT-COMPRESSOR-linux-x64-*.zip`, extract and copy
            `PHU BARK FFT COMPRESSOR.vst3` to `~/.vst3/`.

            Each zip contains the `.vst3` bundle and a `README.pdf` with full documentation.

            ### Prerequisite (Windows)

            Requires the [Visual C++ 2015–2022 Redistributable (x64)](https://aka.ms/vs/17/release/vc_redist.x64.exe).

            ### What's Changed

            See [CHANGELOG](https://github.com/huberp/phu-bark-fft-compressor/commits/${{ github.ref_name }})
            or compare against the previous tag.
          files: dist/*.zip